const PAGE_SIZE = 50;

let filtered = [...SCENES];
let sortCol = null;
let sortDir = 1;
let page = 1;

const tbody = document.getElementById('tbody');
const pager = document.getElementById('pager');
const searchEl = document.getElementById('search');
const modelEl = document.getElementById('model-filter');
const countEl = document.getElementById('count-label');

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilters() {
  const q = searchEl.value.trim().toLowerCase();
  const m = modelEl.value;
  filtered = SCENES.filter(s => {
    if (m && s.model !== m) return false;
    if (q && !s.title.toLowerCase().includes(q) && !s.model.toLowerCase().includes(q)) return false;
    return true;
  });
  if (sortCol) {
    filtered.sort((a, b) => {
      const av = a[sortCol].toLowerCase(), bv = b[sortCol].toLowerCase();
      return av < bv ? -sortDir : av > bv ? sortDir : 0;
    });
  }
  page = 1;
  render();
}

function render() {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(page, totalPages);
  const start = (page - 1) * PAGE_SIZE;
  const slice = filtered.slice(start, start + PAGE_SIZE);

  countEl.textContent = total === SCENES.length
    ? `${total} scenes`
    : `${total} of ${SCENES.length} scenes`;

  tbody.innerHTML = slice.map((s, i) => `
    <tr>
      <td class="col-num">${start + i + 1}</td>
      <td class="col-model"><a class="model-link" href="#" onclick="filterModel('${esc(s.model)}');return false;">${esc(s.model)}</a></td>
      <td class="col-title"><a class="scene-link" href="${esc(s.url)}" target="_blank" rel="noopener nofollow">${esc(s.title)}</a></td>
      <td class="col-preview"><a class="thumb-btn" href="#" onclick="openModal(${start+i},'${esc(s.thumb)}','${esc(s.model)}','${esc(s.title)}','${esc(s.url)}');return false;" title="Preview">▶</a></td>
    </tr>`).join('');

  renderPager(totalPages);
}

function renderPager(totalPages) {
  if (totalPages <= 1) { pager.innerHTML = ''; return; }
  const MAX_BTNS = 7;
  let pages = [];
  if (totalPages <= MAX_BTNS) {
    pages = Array.from({length: totalPages}, (_,i) => i+1);
  } else {
    pages = [1];
    let start = Math.max(2, page - 2);
    let end = Math.min(totalPages - 1, page + 2);
    if (start > 2) pages.push('…');
    for (let i = start; i <= end; i++) pages.push(i);
    if (end < totalPages - 1) pages.push('…');
    pages.push(totalPages);
  }
  pager.innerHTML =
    `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹ Prev</button>` +
    pages.map(p => p === '…'
      ? `<span class="page-ellipsis">…</span>`
      : `<button class="page-btn ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`
    ).join('') +
    `<button class="page-btn" onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>Next ›</button>`;
}

function goPage(p) {
  page = p;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function filterModel(name) {
  modelEl.value = name;
  searchEl.value = '';
  applyFilters();
}

// Sort
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir = -sortDir;
    else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(t => t.classList.remove('sorted'));
    th.classList.add('sorted');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    applyFilters();
  });
});

searchEl.addEventListener('input', applyFilters);
modelEl.addEventListener('change', applyFilters);

// Modal
function openModal(idx, thumb, model, title, url) {
  document.getElementById('modal-img').src = thumb;
  document.getElementById('modal-model').textContent = model;
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-btn').href = url;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-img').src = '';
  document.body.style.overflow = '';
}
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
